<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Secret Garden: My Empathy Journey</title>
  <meta name="description" content="An interactive 3D empathy adventure based on The Secret Garden by Frances Hodgson Burnett.">
  <meta name="theme-color" content="#1f3326">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Three.js (3D) is loaded as an ES module. If it cannot load, the game switches to a 2D map. -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <!-- GSAP: smooth camera and interface animation (the game still works without it) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="js/config.js"></script>
</head>
<body>
  <!-- 3D world -->
  <div id="world" class="world" aria-hidden="true"></div>
  <!-- 2D fallback map (shown only if 3D cannot start) -->
  <div id="fallback-map" class="fallback-map" hidden></div>
  <!-- Map pins: clickable, keyboard-friendly buttons placed over the 3D objects -->
  <nav id="pins" class="pins" aria-label="Garden map" hidden></nav>
  <div id="hover-label" class="hover-label" hidden></div>

  <!-- Loading screen -->
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader-inner">
      <svg class="loader-flower" viewBox="0 0 120 160" aria-hidden="true">
        <path class="lf-stem" d="M60 150 C60 120 58 95 60 70" />
        <path class="lf-leaf lf-leaf-l" d="M59 118 C44 112 36 100 34 92 C46 94 56 104 59 118 Z" />
        <path class="lf-leaf lf-leaf-r" d="M61 104 C76 98 84 86 86 78 C74 80 64 90 61 104 Z" />
        <g class="lf-bloom">
          <circle cx="60" cy="52" r="11" class="lf-petal" transform="rotate(0 60 62) translate(0 -2)" />
          <circle cx="60" cy="52" r="11" class="lf-petal" transform="rotate(72 60 62)" />
          <circle cx="60" cy="52" r="11" class="lf-petal" transform="rotate(144 60 62)" />
          <circle cx="60" cy="52" r="11" class="lf-petal" transform="rotate(216 60 62)" />
          <circle cx="60" cy="52" r="11" class="lf-petal" transform="rotate(288 60 62)" />
          <circle cx="60" cy="62" r="7" class="lf-center" />
        </g>
        <path class="lf-soil" d="M30 152 Q60 142 90 152 Z" />
      </svg>
      <p class="loader-text">Growing the Secret Garden…</p>
      <p class="loader-pct" id="loader-pct">0%</p>
    </div>
  </div>

  <!-- Landing scene text (the 3D garden gate is behind it) -->
  <section id="landing" class="landing" hidden>
    <div class="landing-title">
      <p class="eyebrow">Inspired by Frances Hodgson Burnett</p>
      <h1>The Secret Garden</h1>
      <p class="subtitle">My Empathy Journey</p>
      <div class="landing-actions">
        <button id="btn-enter" class="btn btn-primary btn-lg">Enter the Garden</button>
        <button id="btn-continue" class="btn btn-ghost" hidden>Continue my journey</button>
      </div>
    </div>
    <div class="landing-foot">
      <button id="btn-about" class="link-btn">About the Project</button>
      <span aria-hidden="true">·</span>
      <button id="btn-demo" class="link-btn">Demo Mode</button>
      <span aria-hidden="true">·</span>
      <button id="btn-research-mode" class="link-btn">For teachers</button>
    </div>
  </section>

  <!-- Game HUD -->
  <header id="hud" class="hud" hidden>
    <div class="hud-mission">
      <span class="hud-eyebrow" id="hud-eyebrow">The Secret Garden</span>
      <span class="hud-title" id="hud-title">Garden Map</span>
    </div>
    <div class="hud-actions">
      <button class="icon-btn" id="btn-journal" aria-label="Open the Garden Journal" title="Garden Journal">
        <span aria-hidden="true">📖</span>
      </button>
      <button class="icon-btn" id="btn-sound" aria-label="Turn sound off" title="Sound">
        <span class="snd-on">🔊</span><span class="snd-off">🔇</span>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zm8.6 4.9l-1.7-.3a7 7 0 01-.6 1.5l1 1.4-1.8 1.8-1.4-1a7 7 0 01-1.5.6l-.3 1.7h-2.6l-.3-1.7a7 7 0 01-1.5-.6l-1.4 1-1.8-1.8 1-1.4a7 7 0 01-.6-1.5l-1.7-.3v-2.6l1.7-.3a7 7 0 01.6-1.5l-1-1.4 1.8-1.8 1.4 1a7 7 0 011.5-.6l.3-1.7h2.6l.3 1.7a7 7 0 011.5.6l1.4-1 1.8 1.8-1 1.4c.3.5.5 1 .6 1.5l1.7.3v2.6z"/></svg>
      </button>
      <button class="icon-btn" id="btn-help" aria-label="Help" title="Help">?</button>
    </div>
    <div class="hud-bottom">
      <div class="journey" aria-label="Journey progress">
        <span class="journey-label" id="journey-label">Journey 0/5</span>
        <span class="journey-dots" id="journey-dots"></span>
      </div>
      <div class="seeds" id="seeds-counter" title="Empathy Seeds">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="seed-ico"><path d="M12 3c4 3 6 6.5 6 10a6 6 0 01-12 0c0-3.5 2-7 6-10z"/><path d="M12 9v9" class="seed-line"/></svg>
        <span>Empathy Seeds: <b id="seed-count">0</b></span>
      </div>
    </div>
  </header>

  <!-- Main interactive layer (screens, missions, assessments) -->
  <main id="stage" class="stage" aria-live="polite"></main>

  <!-- 3D Empathy Pyramid -->
  <section id="pyramid-root" class="pyramid-root" hidden></section>

  <div id="modal-root"></div>
  <div id="achievements" class="achievements" aria-live="polite"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="caption" class="caption" aria-live="polite"></div>
  <div id="transition" class="transition" aria-hidden="true"></div>
  <button id="skip-anim" class="skip-anim" hidden>Skip animation ›</button>

  <noscript>
    <div class="noscript">The Secret Garden needs JavaScript to run. Please turn it on in your browser.</div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
